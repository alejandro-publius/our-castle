[package]
name = "kit-solver"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Exact complete-kit selection over a small, disclosed candidate pool, for Our Castle's kit planner. Pure computation: one JSON request on stdin, one JSON answer on stdout."

[lib]
name = "kit_solver"
path = "src/lib.rs"

[[bin]]
name = "kit-solver"
path = "src/main.rs"

[dependencies]
# JSON reading and writing only; no derive macros, no other crate.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
